<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e0cc91"/>
      <stop offset="0.48" stop-color="#c3a663"/>
      <stop offset="1" stop-color="#89672f"/>
    </linearGradient>
    <radialGradient id="center" cx="40%" cy="32%" r="72%">
      <stop offset="0" stop-color="#45413a"/>
      <stop offset="0.58" stop-color="#242424"/>
      <stop offset="1" stop-color="#101114"/>
    </radialGradient>
    <filter id="shadow" x="-35%" y="-35%" width="170%" height="180%">
      <feDropShadow dx="0" dy="3" stdDeviation="2.4" flood-color="#000" flood-opacity="0.82"/>
    </filter>
  </defs>

  <!-- The middle remains transparent so PIXI can paint live occupant segments. -->
  <circle cx="32" cy="32" r="24" fill="none" stroke="#090a0c" stroke-width="4.2" filter="url(#shadow)"/>
  <circle cx="32" cy="32" r="23.5" fill="none" stroke="url(#gold)" stroke-width="2.2"/>
  <circle cx="32" cy="32" r="21.9" fill="none" stroke="#15161a" stroke-width="0.9"/>

  <!-- A broad, uninterrupted dark center leaves only a fine disposition line. -->
  <circle cx="32" cy="32" r="19.2" fill="url(#center)"/>

  <path d="M 11.4 24.4 A 22.1 22.1 0 0 1 52.6 24.4" fill="none" stroke="#fff" stroke-width="0.65" stroke-linecap="round" opacity="0.27"/>
  <path d="M 18.1 26.6 A 15.7 15.7 0 0 1 45.9 26.6" fill="none" stroke="#fff" stroke-width="0.6" stroke-linecap="round" opacity="0.14"/>
</svg>
